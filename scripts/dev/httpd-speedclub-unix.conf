# SPEED CLUB - dedicated local Apache instance on macOS and Linux (ADR-102, ADR-157).
# The Unix twin of httpd-speedclub.conf: Homebrew's (or the distribution's) httpd binaries with none of their global
# config. PHP runs through PHP-FPM, the model most shared hosts use, and web/public/.htaccess applies as in production.
# scripts/services.sh starts it with -d <httpd prefix> and -C "Define SC_ROOT <repo>"; do not start this file by hand.

<IfDefine !SC_FCGI_PORT>
    Define SC_FCGI_PORT 9085
</IfDefine>

Listen 8080
ServerName localhost:8080
PidFile "${SC_ROOT}/web/storage/logs/apache-8080.pid"
Timeout 300

LoadModule mpm_event_module lib/httpd/modules/mod_mpm_event.so
LoadModule unixd_module lib/httpd/modules/mod_unixd.so
LoadModule access_compat_module lib/httpd/modules/mod_access_compat.so
LoadModule alias_module lib/httpd/modules/mod_alias.so
LoadModule authz_core_module lib/httpd/modules/mod_authz_core.so
LoadModule authz_host_module lib/httpd/modules/mod_authz_host.so
LoadModule deflate_module lib/httpd/modules/mod_deflate.so
LoadModule dir_module lib/httpd/modules/mod_dir.so
LoadModule env_module lib/httpd/modules/mod_env.so
LoadModule expires_module lib/httpd/modules/mod_expires.so
LoadModule filter_module lib/httpd/modules/mod_filter.so
LoadModule headers_module lib/httpd/modules/mod_headers.so
LoadModule log_config_module lib/httpd/modules/mod_log_config.so
LoadModule mime_module lib/httpd/modules/mod_mime.so
LoadModule proxy_module lib/httpd/modules/mod_proxy.so
LoadModule proxy_fcgi_module lib/httpd/modules/mod_proxy_fcgi.so
LoadModule rewrite_module lib/httpd/modules/mod_rewrite.so
LoadModule setenvif_module lib/httpd/modules/mod_setenvif.so

<IfModule mpm_event_module>
    StartServers 2
    ThreadsPerChild 32
    MaxRequestWorkers 128
</IfModule>

TypesConfig "${SC_MIME_TYPES}"
AddType image/webp .webp
AddType font/woff2 .woff2
AddType application/javascript .js .mjs
AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/javascript application/json image/svg+xml

ErrorLog "${SC_ROOT}/web/storage/logs/apache-error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b %D" sc
CustomLog "${SC_ROOT}/web/storage/logs/apache-access.log" sc

ProxyTimeout 300

DocumentRoot "${SC_ROOT}/web/public"
DirectoryIndex index.php index.html

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Directory "${SC_ROOT}/web/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# SEC-P1-13: the dev mail page lists live verification and reset codes. These surfaces answer this machine only; the app and the
# API stay on the LAN for phone builds. Access is checked on the requested path, before .htaccess rewrites it to index.php, and
# the optional index.php/ covers the front controller's path info.
<LocationMatch "^/(index\.php/)?(dev|_inertia|_boost|docs)(/|$)">
    Require local
</LocationMatch>

<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://127.0.0.1:${SC_FCGI_PORT}"
</FilesMatch>
