# SPEED CLUB - dedicated local Apache instance (ADR-102).
# Uses the binaries of C:\xampp\apache but none of its global config, so other XAMPP sites and
# XAMPP's mod_php (8.0, too old for Laravel 13) stay untouched. PHP runs through FastCGI, the
# same model most shared hosts use, and web/public/.htaccess applies as in production.
# Started and stopped by scripts/services.ps1. Do not start this file by hand.

Define SC_ROOT "C:/xampp/htdocs/speedclub"
Define SC_FCGI_PORT 9085

ServerRoot "C:/xampp/apache"
Listen 8080
ServerName localhost:8080
PidFile "${SC_ROOT}/web/storage/logs/apache-8080.pid"
ThreadsPerChild 64
ThreadLimit 64
Timeout 300

LoadModule access_compat_module modules/mod_access_compat.so
LoadModule alias_module modules/mod_alias.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule expires_module modules/mod_expires.so
LoadModule filter_module modules/mod_filter.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so

TypesConfig conf/mime.types
AddType image/webp .webp
AddType font/woff2 .woff2
AddType application/javascript .js .mjs
AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/javascript application/json image/svg+xml

ErrorLog "${SC_ROOT}/web/storage/logs/apache-error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b %D" sc
CustomLog "${SC_ROOT}/web/storage/logs/apache-access.log" sc

ProxyFCGIBackendType GENERIC
ProxyTimeout 300

DocumentRoot "${SC_ROOT}/web/public"
DirectoryIndex index.php index.html

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Directory "${SC_ROOT}/web/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# SEC-P1-13: the dev mail page lists live verification and reset codes. These surfaces answer this machine only; the app and the
# API stay on the LAN for phone builds. Access is checked on the requested path, before .htaccess rewrites it to index.php, and
# the optional index.php/ covers the front controller's path info.
<LocationMatch "^/(index\.php/)?(dev|_inertia|_boost|docs)(/|$)">
    Require local
</LocationMatch>

# Windows paths start with a drive letter: the handler needs the trailing slash to stay a valid URI,
# and SCRIPT_FILENAME must be rebuilt because php-cgi cannot open "/C:/...".
<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://127.0.0.1:${SC_FCGI_PORT}/"
    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "${SC_ROOT}/web/public%{reqenv:SCRIPT_NAME}"
</FilesMatch>
