; SPEED CLUB - PHP-FPM pool for the dedicated local Apache on macOS and Linux (ADR-157).
; The same limits as the php-cgi pool of scripts/services.ps1 on Windows. scripts/services.sh exports SC_ROOT and starts
; php-fpm with this file; do not start it by hand.

[global]
pid = ${SC_ROOT}/web/storage/logs/php-fpm-9085.pid
error_log = ${SC_ROOT}/web/storage/logs/php-fpm-error.log
daemonize = yes

[speedclub]
listen = 127.0.0.1:9085
pm = static
pm.max_children = 12
pm.max_requests = 0
clear_env = no
catch_workers_output = yes
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 120
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq] = 0
php_admin_value[expose_php] = 0
php_admin_flag[display_errors] = off
